<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>手册速查</title>
<style>
:root{
  --bg:#F1F3F5; --panel:#FFFFFF; --fg:#16202B; --muted:#5B6773; --line:#D3D9DF;
  --sign:#FFC400; --signfg:#101820; --hit:#FFE27A; --hitfg:#16202B;
  --warn:#B3261E; --ok:#1E6B4A; --bar:#101820; --barfg:#F1F3F5;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E141A; --panel:#161E26; --fg:#E7ECF1; --muted:#93A0AD; --line:#2A3540;
    --hit:#6B5600; --hitfg:#FFF4C2; --warn:#FF8A80; --ok:#6FD3A1; --bar:#070B0F;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:17px/1.65 -apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
.top{background:var(--bar);color:var(--barfg);padding:env(safe-area-inset-top) 16px 0;border-bottom:4px solid var(--sign);position:sticky;top:0;z-index:5}
.brand{font-size:19px;font-weight:700;padding:12px 0 8px;letter-spacing:.02em}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;min-height:46px;border:0;background:transparent;color:var(--barfg);opacity:.62;font:inherit;font-weight:600;border-bottom:4px solid transparent;margin-bottom:-4px}
.tabs button.on{opacity:1;border-bottom-color:var(--sign)}
main{max-width:760px;margin:0 auto;padding:8px 16px 48px}
section[hidden]{display:none}
h2{font-size:17px;margin:26px 0 8px;font-weight:700}
.step{display:inline-block;min-width:26px;text-align:center;background:var(--sign);color:var(--signfg);border:2px solid var(--signfg);border-radius:3px;font-weight:800;margin-right:8px;font-size:15px;line-height:22px}
.muted{color:var(--muted);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:2px solid var(--fg);background:var(--panel);color:var(--fg);font:inherit;font-weight:700;border-radius:4px;cursor:pointer}
.btn.primary{background:var(--sign);color:var(--signfg);border-color:var(--signfg)}
.btn[disabled]{opacity:.4}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:15px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=search]{width:100%;min-height:48px;padding:8px 12px;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg)}
input:focus{outline:3px solid var(--sign);border-color:var(--fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{height:10px;background:var(--line);border-radius:2px;overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--sign);transition:width .15s}
.note{border-left:4px solid var(--line);padding:2px 0 2px 12px;margin:10px 0;color:var(--muted);font-size:15px}
.note.warn{border-left-color:var(--warn);color:var(--fg)}
.note.warn b{color:var(--warn)}
.sum{font-size:18px;font-weight:700;margin:6px 0}
details{margin-top:14px;border-top:1px solid var(--line)}
summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.toc{list-style:none;margin:0;padding:0}
.toc li{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:16px;line-height:1.5}
.toc li.d2{padding-left:18px}.toc li.d3{padding-left:36px}
.toc .cnt{margin-left:auto;white-space:nowrap;color:var(--muted);font-size:14px}
.toc li.empty .cnt{color:var(--warn);font-weight:700}
.sign{display:inline-block;background:var(--sign);color:var(--signfg);border:2px solid var(--signfg);border-radius:3px;font-weight:800;padding:0 7px;line-height:1.35;font-size:.9em;white-space:nowrap}
.sbox{display:flex;gap:8px;margin:10px 0 6px;position:sticky;top:calc(env(safe-area-inset-top) + 56px);z-index:4;background:var(--bg);padding:6px 0}
.sbox input{flex:1;font-size:19px}
.sbox .btn{min-width:84px}
.btn.rec{background:var(--warn);color:#fff;border-color:var(--warn)}
.seg{display:flex;border:2px solid var(--fg);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.seg button{flex:1;min-height:44px;border:0;background:var(--panel);color:var(--fg);font:inherit;font-weight:700}
.seg button+button{border-left:2px solid var(--fg)}
.seg button.on{background:var(--sign);color:var(--signfg)}
.meta{font-size:14px;color:var(--muted);margin:8px 0}
.grp{border-top:1px solid var(--line);padding:10px 0 4px;margin-top:6px}
.gh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.gt{font-weight:700;font-size:18px}
.gs{font-size:14px;color:var(--muted);flex-basis:100%}
.seg-p{margin:10px 0;font-size:19px;line-height:1.75;padding-left:12px;border-left:4px solid transparent;white-space:pre-wrap;word-break:break-word}
.seg-p.hit{border-left-color:var(--sign)}
.seg-p.dim{opacity:.62}
.seg-p .ld{display:block;font-size:14px;color:var(--muted);margin-bottom:2px}
.seg-p.h{font-style:italic;color:var(--muted)}
mark{background:var(--hit);color:var(--hitfg);border-radius:2px;padding:0 1px}
.empty-s{padding:28px 0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:4px;font-size:15px;z-index:9;max-width:90%}

.adv{margin-top:18px;border-top:1px solid var(--line)}
.adv summary{font-weight:600;color:var(--muted)}
.lnk{border:0;background:transparent;color:var(--muted);font:inherit;font-size:15px;text-decoration:underline;min-height:40px;padding:0 4px}
#feed{scroll-margin-top:150px}
.kw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:2px 0 8px}
.kw b{font-size:13px;color:var(--muted);font-weight:600;margin-right:2px}
.kw i{font-style:normal;font-size:15px;font-weight:700;border:1.5px solid var(--fg);border-radius:3px;padding:0 7px;line-height:1.5}
.kw i.fix{border-style:dashed;color:var(--muted)}
.stale{opacity:.45}
.ask.hearing .aq{color:var(--muted)}
.feedbar{display:flex;justify-content:space-between;align-items:center;min-height:30px}
.ask{border-top:3px solid var(--fg);margin-top:14px}
.ask.open{border-top-color:var(--sign)}
.ah{display:flex;width:100%;align-items:baseline;gap:10px;text-align:left;border:0;background:transparent;color:var(--fg);font:inherit;padding:10px 0 4px;cursor:pointer}
.aq{font-size:21px;font-weight:800;line-height:1.45;flex:1;word-break:break-word}
.ask:not(.open) .aq{font-size:17px;font-weight:700}
.at{font-size:13px;color:var(--muted);white-space:nowrap}
.live{display:inline-block;background:var(--warn);color:#fff;font-size:13px;font-weight:700;border-radius:3px;padding:0 6px;margin-left:6px;vertical-align:2px}
.asum{font-size:15px;color:var(--muted);padding:0 0 10px}
textarea{width:100%;min-height:96px;padding:10px 12px;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg)}
select{min-height:44px;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg);padding:0 8px}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}

.stat{font-size:13px;font-weight:500;opacity:.72;margin-left:8px}
.more{margin:8px 0 6px;min-height:44px;width:100%}
.mlist{margin:6px 0;font-size:15px}
.mlist div{padding:6px 0;border-bottom:1px solid var(--line)}
a{color:var(--fg)}
</style>
</head>
<body>
<header class="top"><div class="brand">手册速查<span id="status" class="stat"></span></div></header>
<main>
  <div class="sbox">
    <input id="q" type="search" placeholder="输入问题，回车确认" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="mic" class="btn" type="button">开始聆听</button>
  </div>
  <div id="micMsg" class="muted">&nbsp;</div>
  <div class="seg" id="lvl">
    <button type="button" data-l="fine" class="on">细</button>
    <button type="button" data-l="mid">中</button>
    <button type="button" data-l="coarse">粗</button>
  </div>
  <div class="meta">细：只看命中的那一段　中：看整个小节　粗：看整章</div>
  <div class="feedbar"><span class="meta">最新的问题在最上面</span><button id="clearFeed" class="lnk" type="button">清空记录</button></div>
  <div id="feed"></div>

  <details class="adv"><summary>手册与设置</summary>
    <h2>已载入的手册</h2>
    <div id="dbInfo" class="mlist"></div>
    <div class="row">
      <button id="chk" class="btn" type="button">检查更新</button>
      <label class="btn" for="jsonFile">载入本地 JSON</label>
      <input id="jsonFile" type="file" accept=".json,application/json" multiple hidden>
      <button id="clrCache" class="btn" type="button">清除本机缓存</button>
    </div>
    <p class="muted">手册第一次从仓库下载后存在本机，之后没网也能用；有网时每次打开会自动检查更新。拆分手册请去 <a href="./splitter.html">拆分页</a>。</p>
    <h2>停顿多久开始搜</h2>
    <select id="pause"><option value="800">0.8 秒</option><option value="1000" selected>1 秒</option><option value="1500">1.5 秒</option></select>
    <h2>停顿多久算说完一个问题</h2>
    <select id="gap"><option value="1500">1.5 秒</option><option value="2500" selected>2.5 秒</option><option value="4000">4 秒</option></select>
    <h2>纠错词表</h2>
    <p class="muted">总是听错的词，一行写一条：听成的词 = 正确的词。例如：伊卡姆 = ECAM</p>
    <textarea id="corr" spellcheck="false" autocapitalize="off" placeholder="伊卡姆 = ECAM"></textarea>
  </details>
</main>
<script>
/* ===== CORE：纯函数，不碰网页元素，可单独测试 ===== */
var SEP = '\u0001';
var BULLET_RE = /^[\u2022\u2023\u25AA\u25AB\u25A0\u25A1\u25C6\u25C7\u25CB\u25CF\uE000-\uF8FF]+\s*/;
var NUM_ITEM_RE = /^(?:[（(]\s*\d{1,2}\s*[）)]|[（(]\s*[a-zA-Z]\s*[）)]|[（(]\s*[一二三四五六七八九十]+\s*[）)]|\d{1,2}\s*[.、．]\s*(?=[^\d\s])|[①②③④⑤⑥⑦⑧⑨⑩]|[一二三四五六七八九十]+、)/;
var DLG_RE = /^[\u4e00-\u9fffA-Za-z]{1,8}[：:]\s*[“"「『]/;
var UNIT_RE = /^(号|个|点|米|台|次|位|只|条|项|年|月|日|方向|分钟|秒|%|℃|节|海里)/;

function median(a){ if(!a.length) return 0; var s=a.slice().sort(function(x,y){return x-y}); return s[Math.floor(s.length/2)]; }
function pct(a,p){ if(!a.length) return 0; var s=a.slice().sort(function(x,y){return x-y}); return s[Math.min(s.length-1, Math.floor(s.length*p))]; }
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function isWordCh(c){ return /[A-Za-z0-9]/.test(c); }
function joinText(a,b){ if(!a) return b; if(!b) return a; return (isWordCh(a.slice(-1)) && isWordCh(b.charAt(0))) ? a+' '+b : a+b; }

function parseHeading(t){
  var m = t.match(/^(\d{1,2}(?:\.\d{1,2}){0,3})\s+(\S.*)$/);
  if(!m) return null;
  var num=m[1], title=m[2].trim();
  if(/(^|\.)0\d/.test(num)) return null;
  if(title.length>40) return null;
  if(/[。；，;,]/.test(title)) return null;
  if(UNIT_RE.test(title)) return null;
  return {num:num, depth:num.split('.').length, title:title};
}

/* 把一页的文字块（pdf.js items）整理成一行一行 */
function buildPageLines(pg, opt, junk){
  var auto=(opt.top==null||opt.bottom==null);
  var H=pg.h, topLim=auto?0:H*opt.top/100, botLim=auto?0:H*opt.bottom/100, label='', body=[];
  pg.items.forEach(function(it){
    var s=it.s; if(s===''||s==null) return;
    var t=s.trim(), hh=it.h||0;
    if(t!==''){
      var cy=it.y+hh/2;
      if(H-cy<topLim) return;
      if(cy<botLim){ if(!label && /^[A-Za-z]?\d{1,4}([-－–—.]\d{1,4})?$/.test(t)) label=t; return; }
      if(junk.has(t)) return;
    }
    body.push(it);
  });
  body.sort(function(a,b){ return (b.y-a.y)||(a.x-b.x); });
  var rows=[];
  body.forEach(function(it){
    var L=rows.length?rows[rows.length-1]:null, hh=it.h||0;
    var tol=Math.max(3, 0.3*Math.max(hh, L?L.h:0));
    if(L && Math.abs(L.y-it.y)<=tol){ L.items.push(it); if(hh>L.h) L.h=hh; }
    else rows.push({y:it.y,h:hh,items:[it]});
  });
  var lines=[];
  rows.forEach(function(L){
    L.items.sort(function(a,b){return a.x-b.x});
    var lh=Math.max(8,L.h), txt='', prevEnd=null, x0=null, x1=null;
    L.items.forEach(function(it){
      var t=it.s;
      if(t.trim()===''){
        if(txt!==''){ if(it.w>1.8*lh){ if(!txt.endsWith(SEP)) txt+=SEP; } else txt+=' '; }
        return;
      }
      if(prevEnd!==null && !txt.endsWith(SEP) && it.x-prevEnd>1.8*lh) txt+=SEP;
      txt+=t;
      if(x0===null) x0=it.x;
      prevEnd=it.x+it.w; x1=prevEnd;
    });
    txt=txt.replace(/ {2,}/g,' ').replace(/ ?\u0001 ?/g,SEP).replace(/^\u0001+|\u0001+$/g,'').trim();
    if(txt!=='') lines.push({t:txt,x0:x0,x1:x1,y:L.y,h:lh});
  });
  return {lines:lines, label:label, H:H};
}

/* 自动识别页眉页脚：同一位置每页都有、而且内容相似（或是页码）的行 */
var PAGENUM_RE=/^(第\s*)?[A-Za-z]?\d{1,4}([-－–—.]\d{1,4})?(\s*页)?$|^page\s*\d+(\s*of\s*\d+)?$|^\d+\s*\/\s*\d+$/i;
function autoStrip(infos){
  var withText=infos.filter(function(i){return i.lines.length}).length;
  var need=Math.max(3, Math.ceil(0.5*withText));
  var cl=new Map();
  infos.forEach(function(inf){
    inf.lines.forEach(function(L){
      var H=inf.H, c=L.y+L.h/2, dTop=H-c, dBot=c, z, d;
      if(dTop<0.18*H){ z='t'; d=dTop; } else if(dBot<0.18*H){ z='b'; d=dBot; } else return;
      var key=z+Math.round(d/4), a=cl.get(key); if(!a){ a=[]; cl.set(key,a); }
      a.push({inf:inf,L:L});
    });
  });
  var removed=[];
  cl.forEach(function(mem){
    var pgs=new Set(mem.map(function(m){return m.inf.page}));
    if(pgs.size<need) return;
    var texts=mem.map(function(m){return m.L.t.replace(/\u0001/g,' ').trim()});
    var pn=texts.filter(function(t){return PAGENUM_RE.test(t)}).length;
    var isHF=pn>=0.7*mem.length;
    if(!isHF){
      var cnt={}, best=0;
      texts.forEach(function(t){
        var s=t.replace(/[\s\d]/g,''); if(s.length<4) return;
        ['p'+s.slice(0,4),'s'+s.slice(-4),'e'+s].forEach(function(k){ cnt[k]=(cnt[k]||0)+1; if(cnt[k]>best) best=cnt[k]; });
      });
      isHF=best>=0.6*mem.length;
    }
    if(!isHF) return;
    mem.forEach(function(m,i){
      m.L.drop=true;
      if(pn>=0.7*mem.length && PAGENUM_RE.test(texts[i]) && !m.inf.label) m.inf.label=texts[i];
    });
    removed.push(texts[0]);
  });
  infos.forEach(function(inf){ inf.lines=inf.lines.filter(function(L){return !L.drop}); });
  return removed;
}

function stripTokens(t, toks){
  toks.forEach(function(k){
    var e=escRe(k);
    t=t.replace(new RegExp('^'+e+'(?![A-Za-z0-9])'),'').replace(new RegExp('(^|[^A-Za-z0-9])'+e+'$'),'$1');
  });
  return t.trim();
}

function buildChunks(pages, userOpt){
  var opt=Object.assign({top:null,bottom:null,extra:[],maxLen:420,pieceLen:300}, userOpt||{});
  var n=pages.length;
  /* 1) 找水印：短的、含英文字母、整本里反复出现的文字块 */
  var cnt=new Map(), pgs=new Map();
  pages.forEach(function(pg,pi){ pg.items.forEach(function(it){
    var t=(it.s||'').trim(); if(!t||t.length>14||!/[A-Za-z]/.test(t)) return;
    cnt.set(t,(cnt.get(t)||0)+1);
    var s=pgs.get(t); if(!s){s=new Set(); pgs.set(t,s);} s.add(pi);
  });});
  var junk=new Set(opt.extra.map(function(x){return x.trim()}).filter(Boolean));
  var autoJunk=[];
  if(n>=3) cnt.forEach(function(c,t){ if(c>=2*n && pgs.get(t).size>=0.6*n){ junk.add(t); autoJunk.push(t); } });
  /* 2) 每页整理成行 */
  var infos=pages.map(function(pg,pi){
    var r=buildPageLines(pg,opt,junk);
    return {page:pi+1,label:r.label,lines:r.lines,H:r.H};
  });
  var hfRemoved=[];
  if(opt.top==null||opt.bottom==null) hfRemoved=autoStrip(infos);
  infos.forEach(function(inf){ inf.lines.forEach(function(L){ L.page=inf.page; L.pl=inf.label; }); });
  var extraToks=Array.from(junk);
  var blankRe=/^(本页)?(有意|故意)?空白(页)?$|^(this page )?intentionally left blank\.?$/i;
  var tocRe=/^(目\s*录|contents|table of contents)$/i;
  var stats={pages:n,tocPages:[],blankPages:[],lowTextPages:[],autoJunk:autoJunk,hf:hfRemoved,headings:[]};
  infos.forEach(function(inf){
    inf.lines=inf.lines.map(function(L){ L.t=stripTokens(L.t, extraToks); return L; }).filter(function(L){ return L.t!==''; });
    if(inf.lines.some(function(L){ return tocRe.test(L.t.replace(/\u0001/g,'')); })){ inf.skip='toc'; stats.tocPages.push(inf.page); return; }
    if(inf.lines.some(function(L){ return blankRe.test(L.t); })){ inf.lines=inf.lines.filter(function(L){ return !blankRe.test(L.t); }); if(!inf.lines.length){ inf.skip='blank'; stats.blankPages.push(inf.page); } }
  });
  /* 3) 整本里反复出现的整行（多半是页眉页脚的漏网之鱼） */
  var lc=new Map();
  infos.forEach(function(inf,pi){ if(inf.skip) return; inf.lines.forEach(function(L){ var k=L.t.replace(/[\s\d]/g,''); if(!k) return; var s=lc.get(k); if(!s){s=new Set(); lc.set(k,s);} s.add(pi); }); });
  if(n>=5) infos.forEach(function(inf){ if(inf.skip) return; inf.lines=inf.lines.filter(function(L){ var k=L.t.replace(/[\s\d]/g,''); var s=lc.get(k); return !(s && s.size>=0.6*n && L.t.length<=80); }); });
  /* 4) 页面版心 */
  var flat=[]; infos.forEach(function(inf){ if(inf.skip) return; var tot=0; inf.lines.forEach(function(L){ tot+=L.t.replace(/\u0001/g,'').length; flat.push(L); }); if(tot<30) stats.lowTextPages.push(inf.page); });
  var rights=flat.filter(function(L){return L.t.indexOf(SEP)<0 && L.t.length>=12}).map(function(L){return L.x1});
  var rightM=pct(rights,0.9), medH=median(flat.map(function(L){return L.h}))||12;
  /* 5) 表格行：连续 2 行以上都有列间距才算表格，单行当普通文字 */
  for(var i=0;i<flat.length;){
    if(flat[i].t.indexOf(SEP)>=0){
      var j=i; while(j<flat.length && flat[j].t.indexOf(SEP)>=0 && flat[j].page===flat[i].page) j++;
      if(j-i>=2){ for(var k=i;k<j;k++) flat[k].tb=true; }
      else flat[i].t=flat[i].t.split(SEP).join(' ');
      i=j;
    } else i++;
  }
  /* 6) 切段 */
  var chunks=[], cur=null, tbl=null, hp={ch:null,sec:null,sub:null}, lastCh=0, headObj=null;
  function ctx(){ return {ch:hp.ch?hp.ch.num:'',chT:hp.ch?hp.ch.title:'',sec:hp.sec?hp.sec.num:'',secT:hp.sec?hp.sec.title:'',sub:hp.sub?hp.sub.num:'',subT:hp.sub?hp.sub.title:''}; }
  var lead='', leadN=0;
  function push(k,t,page,pl,extra){
    var c=ctx(); c.pg=page; c.pl=pl||''; c.k=k; c.t=t;
    if(k==='p' || k==='tb'){
      var isLead=/[：:]$/.test(t) && t.length<=80;
      if(isLead){ lead=t; leadN=12; }
      else if(lead && leadN>0){ c.ld=lead; leadN--; }
    }
    if(extra){ if(extra.b) c.b=1; if(extra.cx!=null) c.cx=extra.cx; }
    chunks.push(c);
    if(headObj && k!=='h') headObj.count++;
  }
  function flush(){ if(cur && cur.t.trim()) push('p',cur.t.trim(),cur.page,cur.pl,{b:cur.b,cx:cur.cx}); cur=null; }
  stats.emptyHeads=[];
  function closeHead(nextDepth){
    if(headObj && headObj.count===0 && !(nextDepth && nextDepth>headObj.depth)){
      push('h',headObj.num+' '+headObj.title,headObj.page,headObj.pl);
      stats.emptyHeads.push(headObj.num+' '+headObj.title);
    }
  }
  function headingOk(h){
    var p0=parseInt(h.num.split('.')[0],10);
    if(h.depth===1) return (p0>lastCh && p0<=lastCh+3) || (lastCh===0 && p0<=30);
    if(!hp.ch) return true;
    return p0===parseInt(hp.ch.num,10);
  }
  for(var q=0;q<flat.length;q++){
    var L=flat[q];
    if(L.tb){ if(!tbl){ flush(); tbl={rows:[],page:L.page,pl:L.pl}; } tbl.rows.push(L.t.split(SEP).join(' | ')); continue; }
    if(tbl){ push('tb',tbl.rows.join('\n'),tbl.page,tbl.pl); tbl=null; }
    var text=L.t, hd=parseHeading(text);
    if(hd && headingOk(hd)){
      flush(); closeHead(hd.depth); lead=''; leadN=0;
      var nx=flat[q+1];
      if(hd.title.length>=20 && !/[：:]$/.test(hd.title) && nx && !nx.tb && nx.page===L.page && nx.t.length<=15 && !BULLET_RE.test(nx.t) && !NUM_ITEM_RE.test(nx.t) && !parseHeading(nx.t)){ hd.title+=nx.t; q++; }
      hd.title=hd.title.replace(/[：:。\s]+$/,'');
      var ho={num:hd.num,depth:hd.depth,title:hd.title,page:L.page,pl:L.pl,count:0};
      if(hd.depth===1){ hp={ch:ho,sec:null,sub:null}; lastCh=parseInt(hd.num,10); }
      else if(hd.depth===2){ hp.sec=ho; hp.sub=null; }
      else hp.sub=ho;
      headObj=ho; stats.headings.push(ho);
      continue;
    }
    var isBul=BULLET_RE.test(text), isNum=!isBul && (NUM_ITEM_RE.test(text) || DLG_RE.test(text));
    var big=L.h>1.4*medH;
    if(isBul) text=text.replace(BULLET_RE,'');
    if(isBul||isNum){ flush(); cur={t:'',page:L.page,pl:L.pl,b:true}; }
    else if(big) flush();
    if(!cur) cur={t:'',page:L.page,pl:L.pl,b:false};
    cur.t=joinText(cur.t,text);
    cur.cx=(L.x0+L.x1)/2;
    var shortLine=L.x1 < rightM-2*Math.max(L.h,medH);
    var nxt=flat[q+1];
    var wrapTok=nxt && !nxt.tb && nxt.page===L.page && /^[A-Za-z0-9]/.test(nxt.t) && !/[。！？；：”"]$/.test(text);
    if(big || (shortLine && !/[，、]$/.test(text) && !wrapTok)) flush();
  }
  flush(); if(tbl){ push('tb',tbl.rows.join('\n'),tbl.page,tbl.pl); tbl=null; } closeHead(0);
  /* 7) 流程图：连续 3 个以上居中的短句，合成一条 */
  var merged=[];
  for(var a=0;a<chunks.length;){
    var c0=chunks[a];
    if(c0.k==='p' && !c0.b && c0.t.length<=14){
      var b=a; while(b<chunks.length && chunks[b].k==='p' && !chunks[b].b && chunks[b].t.length<=14 && chunks[b].pg===c0.pg && chunks[b].sec===c0.sec && chunks[b].ch===c0.ch) b++;
      var run=chunks.slice(a,b), cxs=run.map(function(r){return r.cx||0});
      if(run.length>=3 && Math.max.apply(null,cxs)-Math.min.apply(null,cxs)<40){
        var m=Object.assign({},run[0]); m.t=run.map(function(r){return r.t}).join(' → '); m.k='fl'; delete m.cx; merged.push(m); a=b; continue;
      }
    }
    merged.push(c0); a++;
  }
  /* 8) 太长的段落按句号切开 */
  var out=[];
  merged.forEach(function(c){
    delete c.cx;
    if(c.k==='p' && c.t.length>opt.maxLen){
      var sents=c.t.match(/[^。；！？]+[。；！？]*|[。；！？]+/g)||[c.t], buf='';
      sents.forEach(function(s){ if(buf && (buf+s).length>opt.pieceLen){ out.push(Object.assign({},c,{t:buf})); buf=''; } buf+=s; });
      if(buf) out.push(Object.assign({},c,{t:buf}));
    } else out.push(c);
  });
  out.forEach(function(c,i){ c.n=i; });
  stats.chunks=out.length;
  return {chunks:out, stats:stats};
}

  var pairs=[], runs2=q.match(/[\u3400-\u9fff]{2,}/g)||[];
  runs2.forEach(function(s){
    for(var j=0;j+2<=s.length;j++){
      var x=s.charAt(j), y=s.charAt(j+1), bg=x+y;
      if(FZ.V2.has(bg) || FILLER.test(bg)) continue;
      var cs=FZ.b1.get(x), k;
      if(cs) for(k=0;k<cs.length;k++) if(isHomo(cs.charAt(k),y)) pairs.push([bg, x+cs.charAt(k)]);
      cs=FZ.b2.get(y);
      if(cs) for(k=0;k<cs.length;k++) if(isHomo(cs.charAt(k),x)) pairs.push([bg, cs.charAt(k)+y]);
    }
  });
  var runs=q.match(/[\u3400-\u9fff]{3,}/g)||[];
  runs.forEach(function(s){
    for(var j=0;j+3<=s.length;j++){
      var a=s.charAt(j), b=s.charAt(j+1), c=s.charAt(j+2);
      if(FZ.T3.has(a+b+c)) continue;
      var cand, k;
      cand=FZ.mc.get(a+b);
      if(cand) for(k=0;k<cand.length;k++){ var x=cand.charAt(k); if(isHomo(x,c)) pairs.push([b+c, b+x]); }
      cand=FZ.mb.get(a+c);
      if(cand) for(k=0;k<cand.length;k++){ var y=cand.charAt(k); if(isHomo(y,b)){ pairs.push([a+b, a+y]); pairs.push([b+c, y+c]); } }
      cand=FZ.ma.get(b+c);
      if(cand) for(k=0;k<cand.length;k++){ var z=cand.charAt(k); if(isHomo(z,a)) pairs.push([a+b, z+b]); }
    }
  });
  return pairs;
}
/* 把一句话整理成可搜索的查询：去口头禅、纠错词表、备选识别结果、模糊补全 */
function prepareQuery(db, raw, corr, alternatives){
  var q=cleanQuery(applyCorr(raw, corr));
  var base=Array.from(new Set(tokenize(q)));
  var extra=new Set();
  latinAlts(q).forEach(function(t){ extra.add(t); });
  (alternatives||[]).forEach(function(a){
    var qa=cleanQuery(applyCorr(a,corr));
    tokenize(qa).forEach(function(t){ if(base.indexOf(t)<0) extra.add(t); });
    latinAlts(qa).forEach(function(t){ extra.add(t); });
  });
  var alts=new Map();
  fuzzyPairs(q, db).forEach(function(p){ var a=alts.get(p[0]); if(!a){ a=[]; alts.set(p[0],a); } if(a.indexOf(p[1])<0) a.push(p[1]); });
  var hl=new Set(base); extra.forEach(function(t){hl.add(t);}); alts.forEach(function(v){ v.forEach(function(t){hl.add(t);}); });
  return {q:q, qn:q.toLowerCase().replace(/\s+/g,''), base:base, extra:Array.from(extra), alts:alts, hl:Array.from(hl)};
}
function searchDB(db, P){
  var N=db.length, qt0=P.base;
  if(!qt0.length || !P.qn) return {hits:[],qt:P.hl||[],known:new Set(),fixed:new Map()};
  var df=qt0.map(function(){return 0;});
  for(var i=0;i<N;i++){ var kb=db[i]._kb, kt=db[i]._kt; for(var j=0;j<qt0.length;j++) if(kb.has(qt0[j])||kt.has(qt0[j])) df[j]++; }
  /* 整个库里都没有、又补不出来的词，没法用来区分，不计入 */
  var known=new Set(), fixed=new Map();
  qt0.forEach(function(t,i){ if(df[i]>0) known.add(t); else if(P.alts.has(t)) fixed.set(t,P.alts.get(t)); });
  /* 听错、但补得回来的词：权重按补回那个词在库里的出现次数算，不然会因为“全库都没有”而权重畸高 */
  var adf=new Map();
  P.alts.forEach(function(arr){ arr.forEach(function(t){ if(!adf.has(t)) adf.set(t,0); }); });
  if(adf.size){ for(var i2=0;i2<N;i2++){ var kb3=db[i2]._kb, kt3=db[i2]._kt; adf.forEach(function(v,t){ if(kb3.has(t)||kt3.has(t)) adf.set(t,v+1); }); } }
  var qt=[], dfs=[];
  for(var q=0;q<qt0.length;q++){
    if(df[q]>0){ qt.push(qt0[q]); dfs.push(df[q]); }
    else if(P.alts.has(qt0[q])){
      var best=null; P.alts.get(qt0[q]).forEach(function(t){ var v=adf.get(t)||0; if(v>0 && (best===null||v<best)) best=v; });
      if(best!==null){ qt.push(qt0[q]); dfs.push(best); }
    }
  }
  if(!qt.length) return {hits:[],qt:P.hl,known:known,fixed:fixed};
  var w=dfs.map(function(d){ return Math.pow(Math.log(1+N/(1+d)),1.25); }), tot=0;
  w.forEach(function(x){ tot+=x; });
  var avg=tot/qt.length, ex=P.extra, altL=qt.map(function(t){ return P.alts.get(t)||[]; });
  if(!SI||SI.n!==N) buildSecIdx(db);
  var secCache=new Map();
  function secCov(c){
    var k=secKeyOf(c), v=secCache.get(k);
    if(v===undefined){
      var st=SI.m.get(k), sum=0;
      for(var b=0;b<qt.length;b++){
        if(st.has(qt[b])) sum+=w[b];
        else { var al=altL[b]; for(var m=0;m<al.length;m++) if(st.has(al[m])){ sum+=0.7*w[b]; break; } }
      }
      v=Math.min(1,sum/tot); secCache.set(k,v);
    }
    return v;
  }
  var res=[];
  for(var a=0;a<N;a++){
    var c=db[a], hit=0, nh=0, kb2=c._kb, kt2=c._kt;
    for(var b=0;b<qt.length;b++){
      var t=qt[b];
      if(kb2.has(t)){ hit+=w[b]; nh++; }
      else if(kt2.has(t)){ hit+=0.45*w[b]; nh++; }
      else { var al=altL[b]; for(var m=0;m<al.length;m++){ if(kb2.has(al[m])){ hit+=0.7*w[b]; nh++; break; } if(kt2.has(al[m])){ hit+=0.3*w[b]; nh++; break; } } }
    }
    var exact=c._nb.indexOf(P.qn)>=0, exactT=!exact && c._n.indexOf(P.qn)>=0;
    if(!exact && ex.length){ var eb=0; for(var e=0;e<ex.length;e++) if(kb2.has(ex[e])) eb++; hit+=0.5*avg*Math.min(eb,3); }
    var ratio=Math.min(1,hit/tot), sc=nh>0?secCov(c):0;
    if(!exact && !exactT){
      if(qt.length<=2){ if(nh<qt.length) continue; }
      else if(ratio<0.3 && !(nh>=1 && sc>=0.75 && ratio>=0.15)) continue;
    }
    res.push({c:c, s:ratio+(exact?1:(exactT?0.4:0))+0.35*sc});
  }
  res.sort(function(x,y){ return (y.s-x.s)||(x.c.t.length-y.c.t.length); });
  return {hits:res, qt:P.hl, known:known, fixed:fixed};
}

/* 把“它抓到的关键词”整理成人能看懂的几个词 */
var SEGW=(typeof Intl!=='undefined' && Intl.Segmenter) ? new Intl.Segmenter('zh',{granularity:'word'}) : null;
function segWords(q){
  var words=[];
  if(SEGW){
    var buf='', it=SEGW.segment(q)[Symbol.iterator](), n;
    while(!(n=it.next()).done){
      var sg=n.value, w=sg.segment;
      if(w.length===1 && /[\u3400-\u9fff]/.test(w) && !FILLER.test(w)){ buf+=w; continue; }
      if(buf){ words.push(buf); buf=''; }
      if(sg.isWordLike) words.push(w);
    }
    if(buf) words.push(buf);
  } else words=q.match(/[\u3400-\u9fff]{2,}|[A-Za-z0-9]{2,}/g)||[];
  return words;
}
/* 把“它抓到的关键词”整理成人能看懂的几个词；听错但补得回来的，带 ≈ */
function keyTerms(q, known, fixed){
  var out=[], seen={};
  function push(w,fix){ if(w.length<2||seen[w]) return; seen[w]=1; out.push(fix?{t:w,fix:true}:{t:w}); }
  segWords(q).forEach(function(w){
    var toks=tokenize(w); if(!toks.length) return;
    var unk=toks.filter(function(t){ return !known.has(t); });
    if(!unk.length){ push(w,false); return; }
    var w2=w, alts=[];
    unk.forEach(function(t){ var a=fixed.get(t); if(a && a.length===1 && w2.indexOf(t)>=0){ w2=w2.split(t).join(a[0]); alts.push(a[0]); } });
    if(!alts.length) return;
    segWords(w2).forEach(function(sw){
      var ok=tokenize(sw).every(function(t){ return known.has(t)||alts.indexOf(t)>=0||(FZ&&FZ.V2&&FZ.V2.has(t)); });
      if(!ok) return;
      push(sw, alts.some(function(x){ return sw.indexOf(x)>=0; }));
    });
  });
  return out.slice(0,8);
}

function esc(s){ return String(s).replace(/[&<>]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

/* ===== 本机存储（IndexedDB）：手册下载一次，之后离线也能用 ===== */
var IDBH=null;
function idbOpen(){
  if(IDBH) return Promise.resolve(IDBH);
  return new Promise(function(res){
    try{
      var r=indexedDB.open('manuals-v1',1);
      r.onupgradeneeded=function(){ r.result.createObjectStore('m'); };
      r.onsuccess=function(){ IDBH=r.result; res(IDBH); };
      r.onerror=function(){ res(null); };
    }catch(e){ res(null); }
  });
}
function idbReq(mode, fn){
  return idbOpen().then(function(db){
    if(!db) return null;
    return new Promise(function(res){
      try{ var tx=db.transaction('m',mode), st=tx.objectStore('m'), out=fn(st); tx.oncomplete=function(){ res(out&&out.result!==undefined?out.result:true); }; tx.onerror=function(){ res(null); }; }
      catch(e){ res(null); }
    });
  });
}
function idbAll(){
  return idbOpen().then(function(db){
    if(!db) return [];
    return new Promise(function(res){
      var out=[];
      try{
        var c=db.transaction('m','readonly').objectStore('m').openCursor();
        c.onsuccess=function(){ var cur=c.result; if(cur){ out.push({key:cur.key,val:cur.value}); cur.continue(); } else res(out); };
        c.onerror=function(){ res(out); };
      }catch(e){ res(out); }
    });
  });
}
function idbPut(k,v){ return idbReq('readwrite',function(st){ return st.put(v,k); }); }
function idbDel(k){ return idbReq('readwrite',function(st){ return st.delete(k); }); }

/* ===== 把一本手册装进搜索库（分批，页面不卡） ===== */
function addManual(name, chunks, key, meta){
  return new Promise(function(done){
    var i=0, out=[];
    (function step(){
      var end=Math.min(i+800, chunks.length);
      for(;i<end;i++){ prepChunk(chunks[i],name); out.push(chunks[i]); }
      if(i<chunks.length){ setTimeout(step,0); return; }
      DB=DB.filter(function(c){ return c.m!==name; }).concat(out);

function dropManual(key){

async function ingest(key, text, sha){

/* ===== 找出仓库里有哪些手册 ===== */
async function remoteList(){

  if(q){ var p=q.split('/'); owner=p[0]; repo=p[1]||''; }

    try{
      var r=await fetch('https://api.github.com/repos/'+owner+'/'+repo+'/contents/',{headers:{'Accept':'application/vnd.github+json'}});
      if(r.ok){ var arr=await r.json(); return {auth:true, files:arr.filter(function(f){ return f.type==='file' && /\.manual\.json$/i.test(f.name); }).map(function(f){ return {name:f.name,sha:f.sha}; })}; }
    }catch(e){}

}
var CHECKING=false;
async function checkUpdates(){
  if(CHECKING) return; CHECKING=true;
  try{
    setStatus('正在检查更新…');
    var lst=await remoteList();
    var have=Object.keys(MAN).length;
    if(!lst){ setStatus(have?('离线或找不到手册列表，使用本机 '+have+' 册'):'还没有手册。请先在 GitHub 仓库上传 *.manual.json'); return; }
    var cached={}; (await idbAll()).forEach(function(x){ cached[x.key]=x.val&&x.val.sha; });
    var changed=0, failed=0;
    for(var i=0;i<lst.files.length;i++){
      var f=lst.files[i];
      if(lst.auth && MAN[f.name] && cached[f.name]===f.sha) continue;
      try{
        setStatus('正在下载 '+f.name+'…');
        var r=await fetch('./'+encodeURIComponent(f.name),{cache:'no-cache'});
        if(!r.ok) throw new Error(r.status);
        await ingest(f.name, await r.text(), f.sha); changed++;

    }
    if(lst.auth){
      var names={}; lst.files.forEach(function(f){ names[f.name]=1; });
      Object.keys(MAN).forEach(function(k){ if(k.indexOf('local:')!==0 && !names[k]){ dropManual(k); idbDel(k); } });
    }
    var n=Object.keys(MAN).length;
    setStatus(failed&&!changed ? ('下载失败，使用本机 '+n+' 册') : (n?(changed?('已更新 '+changed+' 本 · 共 '+n+' 册，可离线使用'):('已是最新 · 共 '+n+' 册，可离线使用')):'仓库里还没有 *.manual.json'));
  }finally{ CHECKING=false; }
}

      var isHit=gr.hit.has(x), p=el('div','seg-p'+(x.k==='h'?' h':'')+(isHit?' hit':(LEVEL==='fine'?'':' dim')));
      if(x.ld) p.appendChild(el('span','ld',x.ld));
      if(x.k==='h') p.appendChild(document.createTextNode('（本节只有标题，内容可能是图片）'));
      else p.appendChild(hl(x.t, g.qt));
      wrap.appendChild(p);
    });
    if(list.length>shown.length) wrap.appendChild(el('div','meta','…还有 '+(list.length-shown.length)+' 段'));
    body.appendChild(wrap);
  });
  if(!e.more && g.order.length>cap){
    var mb=el('button','btn more','再看 '+(Math.min(g.order.length,full)-cap)+' 条'); mb.type='button';
    mb.onclick=function(){ e.more=true; refreshFeed(); }; body.appendChild(mb);
  } else if(g.order.length>full) body.appendChild(el('div','meta','只显示前 '+full+' 组，说得更具体些会更准。'));
  box.appendChild(body);
  return box;
}
function refreshFeed(){
  var f=$('feed'); f.textContent='';
  if(!DB.length){ f.appendChild(el('div','empty-s','先在“拆分”里拆一本手册，或在下面“手册与设置”里载入之前导出的 JSON。')); return; }
  if(!ENT.length){ f.appendChild(el('div','empty-s','输入问题，或点“开始聆听”，直接说话。')); return; }
  ENT.forEach(function(e){ f.appendChild(entryEl(e)); });
}
function updateEntry(e){
  var f=$('feed');
  if(ENT[0]===e && f.firstChild && f.firstChild.className.indexOf('ask')>=0) f.replaceChild(entryEl(e), f.firstChild);
  else refreshFeed();
}
function newEntry(voice){
  ENT.forEach(function(x){ x.open=false; });
  var e={id:++EID, q:'', alts:[], t:new Date(), open:true, voice:!!voice, keys:[], segs:{}, last:Date.now(), state:(voice?'hear':'done'), pt:null, lastG:null};
  ENT.unshift(e); if(ENT.length>MAXE) ENT.length=MAXE;
  return e;
}
function finalizeDraft(){ DRAFT=null; }
function keepTop(){ var r=$('feed').getBoundingClientRect(); if(r.top<150) $('feed').scrollIntoView({block:'start'}); }

/* 打字 */
var dbt=null;
$('q').addEventListener('input', function(){
  var v=this.value;
  if(!v.trim()){ if(DRAFT){ ENT=ENT.filter(function(x){return x!==DRAFT;}); DRAFT=null; refreshFeed(); } return; }
  if(!DRAFT){ DRAFT=newEntry(false); CUR=null; refreshFeed(); keepTop(); }
  DRAFT.q=v; DRAFT.last=Date.now();
  clearTimeout(dbt); var d=DRAFT; dbt=setTimeout(function(){ updateEntry(d); },120);
});
$('q').addEventListener('keydown', function(ev){
  if(ev.key==='Enter'){ ev.preventDefault(); if(DRAFT){ updateEntry(DRAFT); } finalizeDraft(); this.value=''; this.blur(); }
});
$('lvl').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  LEVEL=b.getAttribute('data-l');
  Array.prototype.forEach.call($('lvl').children, function(x){ x.classList.toggle('on', x===b); });
  refreshFeed();
});
$('clearFeed').onclick=function(){ ENT=[]; CUR=null; DRAFT=null; refreshFeed(); };

/* 纠错词表（存在本机浏览器里） */
function loadCorr(){ CORR=parseCorr($('corr').value); try{ localStorage.setItem('corr',$('corr').value); }catch(e){} }
try{ $('corr').value=localStorage.getItem('corr')||''; }catch(e){}
$('corr').addEventListener('input', function(){ loadCorr(); refreshFeed(); });
loadCorr();

/* ===== 语音：持续聆听，每句话自动出结果 ===== */
var LISTEN=false, REC=null, SID=0, SEGMAP={}, WL=null, ENDS=[];
function gapMs(){ return parseInt($('gap').value,10)||2500; }
function micMsg(t){ $('micMsg').textContent=t||'\u00a0'; }
function micSet(on){ $('mic').classList.toggle('rec',on); $('mic').textContent=on?'停止聆听':'开始聆听'; }
async function lockScreen(on){
  try{
    if(on){ if(navigator.wakeLock && !WL){ WL=await navigator.wakeLock.request('screen'); WL.addEventListener('release',function(){ WL=null; }); } }
    else if(WL){ await WL.release(); WL=null; }
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible' && LISTEN) lockScreen(true); });
function searchNow(e){ clearTimeout(e.pt); e.state='done'; if(ENT.indexOf(e)>=0) updateEntry(e); }
function stopListen(msg){
  LISTEN=false; micSet(false); lockScreen(false);
  if(REC){ try{ REC.stop(); }catch(e){} }
  micMsg(msg||'');
  ENT.forEach(function(x){ if(x.state==='hear'){ clearTimeout(x.pt); x.state='done'; } });
  refreshFeed();
}

function startRec(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ stopListen('这个浏览器不支持语音识别。可以用键盘上的听写键代替。'); return; }
  var rec=new SR(), sid=++SID; REC=rec;
  rec.lang='zh-CN'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=3;
  rec.onstart=function(){ micMsg('聆听中…你说，我听；停顿一下就整体处理，接着说下一句就行。'); };
  rec.onresult=function(ev){
    var now=Date.now(), created=false, touched=null;
    finalizeDraft();
    for(var i=ev.resultIndex;i<ev.results.length;i++){
      var r=ev.results[i], key=sid+':'+i, e=SEGMAP[key], alts=[];
      for(var k=0;k<r.length;k++) alts.push(r[k].transcript);
      if(!e){
        if(CUR && CUR.voice && (now-CUR.last)<gapMs()) e=CUR; else { e=newEntry(true); created=true; }
        SEGMAP[key]=e; e.keys.push(key);
      }
      e.segs[key]=alts; e.last=now; CUR=e; touched=e;
      if(!created && ENT[0]!==e) created=true;
    }
    if(!touched) return;
    var e2=touched, lastFinal=ev.results[ev.results.length-1].isFinal;
    e2.q=e2.keys.map(function(k){ return e2.segs[k][0]; }).join('');
    var a1=e2.keys.map(function(k){ return e2.segs[k][1]||e2.segs[k][0]; }).join(''), a2=e2.keys.map(function(k){ return e2.segs[k][2]||e2.segs[k][0]; }).join('');
    e2.alts=[a1,a2].filter(function(x,idx,arr){ return x && x!==e2.q && arr.indexOf(x)===idx; });
    /* 还在说：只显示文字，不搜。停顿一下（或引擎判定说完）才整体处理 */
    e2.state='hear'; clearTimeout(e2.pt);
    if(lastFinal) searchNow(e2); else e2.pt=setTimeout(function(){ searchNow(e2); }, pauseMs());
    if(created){ refreshFeed(); keepTop(); } else if(!lastFinal) updateEntry(e2);
  };
  rec.onerror=function(ev){
    var m={'not-allowed':'麦克风被禁止。到 设置 > Safari > 麦克风 里允许，或是公司限制了。',
           'service-not-allowed':'系统听写没开。到 设置 > 通用 > 键盘 里打开“听写”。',
           'audio-capture':'找不到麦克风。','network':'语音识别需要联网。'}[ev.error];
    if(m) stopListen(m);
  };
  rec.onend=function(){
    REC=null;
    if(!LISTEN) return;
    var t=Date.now(); ENDS.push(t); ENDS=ENDS.filter(function(x){ return t-x<6000; });
    if(ENDS.length>6){ stopListen('反复中断，已停止。点“开始聆听”重试。'); return; }
    setTimeout(function(){ if(LISTEN && !REC) startRec(); },250);
  };
  try{ rec.start(); }catch(e){ stopListen('无法启动：'+(e&&e.message||e)); }
}
$('mic').onclick=function(){
  if(LISTEN){ stopListen(''); return; }
  LISTEN=true; ENDS=[]; micSet(true); lockScreen(true); startRec();
};
refreshFeed();

boot();
</script>
</body>
</html>
