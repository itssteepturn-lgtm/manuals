<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>手册拆分 · 试搜</title>
<style>
:root{
  --bg:#F1F3F5; --panel:#FFFFFF; --fg:#16202B; --muted:#5B6773; --line:#D3D9DF;
  --sign:#FFC400; --signfg:#101820; --hit:#FFE27A; --hitfg:#16202B;
  --warn:#B3261E; --ok:#1E6B4A; --bar:#101820; --barfg:#F1F3F5;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E141A; --panel:#161E26; --fg:#E7ECF1; --muted:#93A0AD; --line:#2A3540;
    --hit:#6B5600; --hitfg:#FFF4C2; --warn:#FF8A80; --ok:#6FD3A1; --bar:#070B0F;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:17px/1.65 -apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
.top{background:var(--bar);color:var(--barfg);padding:env(safe-area-inset-top) 16px 0;border-bottom:4px solid var(--sign);position:sticky;top:0;z-index:5}
.brand{font-size:19px;font-weight:700;padding:12px 0 8px;letter-spacing:.02em}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;min-height:46px;border:0;background:transparent;color:var(--barfg);opacity:.62;font:inherit;font-weight:600;border-bottom:4px solid transparent;margin-bottom:-4px}
.tabs button.on{opacity:1;border-bottom-color:var(--sign)}
main{max-width:760px;margin:0 auto;padding:8px 16px 48px}
section[hidden]{display:none}
h2{font-size:17px;margin:26px 0 8px;font-weight:700}
.step{display:inline-block;min-width:26px;text-align:center;background:var(--sign);color:var(--signfg);border:2px solid var(--signfg);border-radius:3px;font-weight:800;margin-right:8px;font-size:15px;line-height:22px}
.muted{color:var(--muted);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:2px solid var(--fg);background:var(--panel);color:var(--fg);font:inherit;font-weight:700;border-radius:4px;cursor:pointer}
.btn.primary{background:var(--sign);color:var(--signfg);border-color:var(--signfg)}
.btn[disabled]{opacity:.4}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:15px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=search]{width:100%;min-height:48px;padding:8px 12px;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg)}
input:focus{outline:3px solid var(--sign);border-color:var(--fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{height:10px;background:var(--line);border-radius:2px;overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--sign);transition:width .15s}
.note{border-left:4px solid var(--line);padding:2px 0 2px 12px;margin:10px 0;color:var(--muted);font-size:15px}
.note.warn{border-left-color:var(--warn);color:var(--fg)}
.note.warn b{color:var(--warn)}
.sum{font-size:18px;font-weight:700;margin:6px 0}
details{margin-top:14px;border-top:1px solid var(--line)}
summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.toc{list-style:none;margin:0;padding:0}
.toc li{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:16px;line-height:1.5}
.toc li.d2{padding-left:18px}.toc li.d3{padding-left:36px}
.toc .cnt{margin-left:auto;white-space:nowrap;color:var(--muted);font-size:14px}
.toc li.empty .cnt{color:var(--warn);font-weight:700}
.sign{display:inline-block;background:var(--sign);color:var(--signfg);border:2px solid var(--signfg);border-radius:3px;font-weight:800;padding:0 7px;line-height:1.35;font-size:.9em;white-space:nowrap}
.sbox{display:flex;gap:8px;margin:14px 0 6px;position:sticky;top:98px;z-index:4;background:var(--bg);padding:6px 0}
.sbox input{flex:1;font-size:19px}
.sbox .btn{min-width:84px}
.btn.rec{background:var(--warn);color:#fff;border-color:var(--warn)}
.seg{display:flex;border:2px solid var(--fg);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.seg button{flex:1;min-height:44px;border:0;background:var(--panel);color:var(--fg);font:inherit;font-weight:700}
.seg button+button{border-left:2px solid var(--fg)}
.seg button.on{background:var(--sign);color:var(--signfg)}
.meta{font-size:14px;color:var(--muted);margin:8px 0}
.grp{border-top:3px solid var(--fg);padding:12px 0 6px;margin-top:14px}
.gh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.gt{font-weight:700;font-size:18px}
.gs{font-size:14px;color:var(--muted);flex-basis:100%}
.seg-p{margin:10px 0;font-size:19px;line-height:1.75;padding-left:12px;border-left:4px solid transparent;white-space:pre-wrap;word-break:break-word}
.seg-p.hit{border-left-color:var(--sign)}
.seg-p.dim{opacity:.62}
.seg-p .ld{display:block;font-size:14px;color:var(--muted);margin-bottom:2px}
.seg-p.h{font-style:italic;color:var(--muted)}
mark{background:var(--hit);color:var(--hitfg);border-radius:2px;padding:0 1px}
.empty-s{padding:28px 0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:4px;font-size:15px;z-index:9;max-width:90%}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">手册拆分 · 试搜</div>
  <nav class="tabs">
    <button id="tabSplit" class="on" type="button">拆分</button>
    <button id="tabSearch" type="button">试搜 <span id="dbBadge"></span></button>
  </nav>
</header>

<main>
<!-- ============ 拆分 ============ -->
<section id="pSplit">
  <h2><span class="step">1</span>选一本手册（PDF）</h2>
  <div class="row">
    <label class="btn primary" for="pdfFile">选择文件</label>
    <input id="pdfFile" type="file" accept="application/pdf,.pdf" hidden>
  </div>
  <div id="fileInfo" class="muted">还没选文件</div>

  <h2><span class="step">2</span>设置（一般不用改）</h2>
  <label class="field"><span>手册名称（搜索结果里显示这个名字）</span><input id="mName" type="text" placeholder="例如：A330 机组除冰运行指南"></label>
  <div class="two">
    <label class="field"><span>顶部裁掉 %（页眉）</span><input id="cutTop" type="number" inputmode="numeric" min="0" max="25" value="8"></label>
    <label class="field"><span>底部裁掉 %（页码）</span><input id="cutBot" type="number" inputmode="numeric" min="0" max="25" value="8"></label>
  </div>
  <label class="field"><span>额外要去掉的文字（水印等，用逗号分隔）</span><input id="extraJunk" type="text" placeholder="水印会自动识别，认不出来的再填"></label>

  <h2><span class="step">3</span>拆分</h2>
  <div class="row"><button id="goBtn" class="btn primary" type="button" disabled>开始拆分</button></div>
  <div class="bar"><i id="barFill"></i></div>
  <div id="progTxt" class="muted">&nbsp;</div>
  <div id="engineMsg" class="muted"></div>

  <div id="result" hidden>
    <h2><span class="step">4</span>结果</h2>
    <div id="sum" class="sum"></div>
    <div id="warns"></div>
    <div class="row">
      <button id="dlBtn" class="btn primary" type="button">下载 JSON</button>
      <button id="cpBtn" class="btn" type="button">复制 JSON</button>
      <button id="toSearch" class="btn" type="button">去试搜</button>
    </div>
    <details open><summary id="tocSum">章节目录</summary><ol id="toc" class="toc"></ol></details>
  </div>
</section>

<!-- ============ 试搜 ============ -->
<section id="pSearch" hidden>
  <div class="sbox">
    <input id="q" type="search" placeholder="输入问题，或点“说话”" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="mic" class="btn" type="button">说话</button>
  </div>
  <div id="micMsg" class="muted">&nbsp;</div>
  <div class="seg" id="lvl">
    <button type="button" data-l="fine" class="on">细</button>
    <button type="button" data-l="mid">中</button>
    <button type="button" data-l="coarse">粗</button>
  </div>
  <div class="meta">细：只显示命中的那一段　中：显示整个小节　粗：显示整章</div>
  <div id="stat" class="meta"></div>
  <div id="results"><div class="empty-s">先在“拆分”里拆一本手册，或在下面载入之前导出的 JSON。</div></div>

  <h2>已载入的手册</h2>
  <div id="dbInfo" class="muted">还没有</div>
  <div class="row">
    <label class="btn" for="jsonFile">载入 JSON</label>
    <input id="jsonFile" type="file" accept=".json,application/json" multiple hidden>
    <button id="clearDb" class="btn" type="button">清空</button>
  </div>
</section>
</main>
<div id="toast" class="toast" hidden></div>

<script>
/* ===== CORE：纯函数，不碰网页元素，可单独测试 ===== */
var SEP = '\u0001';
var BULLET_RE = /^[\u2022\u2023\u25AA\u25AB\u25A0\u25A1\u25C6\u25C7\u25CB\u25CF\uE000-\uF8FF]+\s*/;
var NUM_ITEM_RE = /^(?:[（(]\s*\d{1,2}\s*[）)]|[（(]\s*[a-zA-Z]\s*[）)]|[（(]\s*[一二三四五六七八九十]+\s*[）)]|\d{1,2}\s*[.、．]\s*(?=[^\d\s])|[①②③④⑤⑥⑦⑧⑨⑩]|[一二三四五六七八九十]+、)/;
var DLG_RE = /^[\u4e00-\u9fffA-Za-z]{1,8}[：:]\s*[“"「『]/;
var UNIT_RE = /^(号|个|点|米|台|次|位|只|条|项|年|月|日|方向|分钟|秒|%|℃|节|海里)/;

function median(a){ if(!a.length) return 0; var s=a.slice().sort(function(x,y){return x-y}); return s[Math.floor(s.length/2)]; }
function pct(a,p){ if(!a.length) return 0; var s=a.slice().sort(function(x,y){return x-y}); return s[Math.min(s.length-1, Math.floor(s.length*p))]; }
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function isWordCh(c){ return /[A-Za-z0-9]/.test(c); }
function joinText(a,b){ if(!a) return b; if(!b) return a; return (isWordCh(a.slice(-1)) && isWordCh(b.charAt(0))) ? a+' '+b : a+b; }

function parseHeading(t){
  var m = t.match(/^(\d{1,2}(?:\.\d{1,2}){0,3})\s+(\S.*)$/);
  if(!m) return null;
  var num=m[1], title=m[2].trim();
  if(/(^|\.)0\d/.test(num)) return null;
  if(title.length>40) return null;
  if(/[。；，;,]/.test(title)) return null;
  if(UNIT_RE.test(title)) return null;
  return {num:num, depth:num.split('.').length, title:title};
}

/* 把一页的文字块（pdf.js items）整理成一行一行 */
function buildPageLines(pg, opt, junk){
  var H=pg.h, topLim=H*opt.top/100, botLim=H*opt.bottom/100, label='', body=[];
  pg.items.forEach(function(it){
    var s=it.s; if(s===''||s==null) return;
    var t=s.trim(), hh=it.h||0;
    if(t!==''){
      var cy=it.y+hh/2;
      if(H-cy<topLim) return;
      if(cy<botLim){ if(!label && /^[A-Za-z]?\d{1,4}([-－–—.]\d{1,4})?$/.test(t)) label=t; return; }
      if(junk.has(t)) return;
    }
    body.push(it);
  });
  body.sort(function(a,b){ return (b.y-a.y)||(a.x-b.x); });
  var rows=[];
  body.forEach(function(it){
    var L=rows.length?rows[rows.length-1]:null, hh=it.h||0;
    var tol=Math.max(3, 0.3*Math.max(hh, L?L.h:0));
    if(L && Math.abs(L.y-it.y)<=tol){ L.items.push(it); if(hh>L.h) L.h=hh; }
    else rows.push({y:it.y,h:hh,items:[it]});
  });
  var lines=[];
  rows.forEach(function(L){
    L.items.sort(function(a,b){return a.x-b.x});
    var lh=Math.max(8,L.h), txt='', prevEnd=null, x0=null, x1=null;
    L.items.forEach(function(it){
      var t=it.s;
      if(t.trim()===''){
        if(txt!==''){ if(it.w>1.8*lh){ if(!txt.endsWith(SEP)) txt+=SEP; } else txt+=' '; }
        return;
      }
      if(prevEnd!==null && !txt.endsWith(SEP) && it.x-prevEnd>1.8*lh) txt+=SEP;
      txt+=t;
      if(x0===null) x0=it.x;
      prevEnd=it.x+it.w; x1=prevEnd;
    });
    txt=txt.replace(/ {2,}/g,' ').replace(/ ?\u0001 ?/g,SEP).replace(/^\u0001+|\u0001+$/g,'').trim();
    if(txt!=='') lines.push({t:txt,x0:x0,x1:x1,y:L.y,h:lh});
  });
  return {lines:lines, label:label};
}

function stripTokens(t, toks){
  toks.forEach(function(k){
    var e=escRe(k);
    t=t.replace(new RegExp('^'+e+'(?![A-Za-z0-9])'),'').replace(new RegExp('(^|[^A-Za-z0-9])'+e+'$'),'$1');
  });
  return t.trim();
}

function buildChunks(pages, userOpt){
  var opt=Object.assign({top:8,bottom:8,extra:[],maxLen:420,pieceLen:300}, userOpt||{});
  var n=pages.length;
  /* 1) 找水印：短的、含英文字母、整本里反复出现的文字块 */
  var cnt=new Map(), pgs=new Map();
  pages.forEach(function(pg,pi){ pg.items.forEach(function(it){
    var t=(it.s||'').trim(); if(!t||t.length>14||!/[A-Za-z]/.test(t)) return;
    cnt.set(t,(cnt.get(t)||0)+1);
    var s=pgs.get(t); if(!s){s=new Set(); pgs.set(t,s);} s.add(pi);
  });});
  var junk=new Set(opt.extra.map(function(x){return x.trim()}).filter(Boolean));
  var autoJunk=[];
  if(n>=3) cnt.forEach(function(c,t){ if(c>=2*n && pgs.get(t).size>=0.6*n){ junk.add(t); autoJunk.push(t); } });
  /* 2) 每页整理成行 */
  var infos=pages.map(function(pg,pi){
    var r=buildPageLines(pg,opt,junk);
    r.lines.forEach(function(L){ L.page=pi+1; L.pl=r.label; });
    return {page:pi+1,label:r.label,lines:r.lines};
  });
  var extraToks=Array.from(junk);
  var blankRe=/^(本页)?(有意|故意)?空白(页)?$|^(this page )?intentionally left blank\.?$/i;
  var tocRe=/^(目\s*录|contents|table of contents)$/i;
  var stats={pages:n,tocPages:[],blankPages:[],lowTextPages:[],autoJunk:autoJunk,headings:[]};
  infos.forEach(function(inf){
    inf.lines=inf.lines.map(function(L){ L.t=stripTokens(L.t, extraToks); return L; }).filter(function(L){ return L.t!==''; });
    if(inf.lines.some(function(L){ return tocRe.test(L.t.replace(/\u0001/g,'')); })){ inf.skip='toc'; stats.tocPages.push(inf.page); return; }
    if(inf.lines.some(function(L){ return blankRe.test(L.t); })){ inf.lines=inf.lines.filter(function(L){ return !blankRe.test(L.t); }); if(!inf.lines.length){ inf.skip='blank'; stats.blankPages.push(inf.page); } }
  });
  /* 3) 整本里反复出现的整行（多半是页眉页脚的漏网之鱼） */
  var lc=new Map();
  infos.forEach(function(inf,pi){ if(inf.skip) return; inf.lines.forEach(function(L){ var k=L.t.replace(/[\s\d]/g,''); if(!k) return; var s=lc.get(k); if(!s){s=new Set(); lc.set(k,s);} s.add(pi); }); });
  if(n>=5) infos.forEach(function(inf){ if(inf.skip) return; inf.lines=inf.lines.filter(function(L){ var k=L.t.replace(/[\s\d]/g,''); var s=lc.get(k); return !(s && s.size>=0.6*n && L.t.length<=80); }); });
  /* 4) 页面版心 */
  var flat=[]; infos.forEach(function(inf){ if(inf.skip) return; var tot=0; inf.lines.forEach(function(L){ tot+=L.t.replace(/\u0001/g,'').length; flat.push(L); }); if(tot<30) stats.lowTextPages.push(inf.page); });
  var rights=flat.filter(function(L){return L.t.indexOf(SEP)<0 && L.t.length>=12}).map(function(L){return L.x1});
  var rightM=pct(rights,0.9), medH=median(flat.map(function(L){return L.h}))||12;
  /* 5) 表格行：连续 2 行以上都有列间距才算表格，单行当普通文字 */
  for(var i=0;i<flat.length;){
    if(flat[i].t.indexOf(SEP)>=0){
      var j=i; while(j<flat.length && flat[j].t.indexOf(SEP)>=0 && flat[j].page===flat[i].page) j++;
      if(j-i>=2){ for(var k=i;k<j;k++) flat[k].tb=true; }
      else flat[i].t=flat[i].t.split(SEP).join(' ');
      i=j;
    } else i++;
  }
  /* 6) 切段 */
  var chunks=[], cur=null, tbl=null, hp={ch:null,sec:null,sub:null}, lastCh=0, headObj=null;
  function ctx(){ return {ch:hp.ch?hp.ch.num:'',chT:hp.ch?hp.ch.title:'',sec:hp.sec?hp.sec.num:'',secT:hp.sec?hp.sec.title:'',sub:hp.sub?hp.sub.num:'',subT:hp.sub?hp.sub.title:''}; }
  var lead='', leadN=0;
  function push(k,t,page,pl,extra){
    var c=ctx(); c.pg=page; c.pl=pl||''; c.k=k; c.t=t;
    if(k==='p' || k==='tb'){
      var isLead=/[：:]$/.test(t) && t.length<=80;
      if(isLead){ lead=t; leadN=12; }
      else if(lead && leadN>0){ c.ld=lead; leadN--; }
    }
    if(extra){ if(extra.b) c.b=1; if(extra.cx!=null) c.cx=extra.cx; }
    chunks.push(c);
    if(headObj && k!=='h') headObj.count++;
  }
  function flush(){ if(cur && cur.t.trim()) push('p',cur.t.trim(),cur.page,cur.pl,{b:cur.b,cx:cur.cx}); cur=null; }
  stats.emptyHeads=[];
  function closeHead(nextDepth){
    if(headObj && headObj.count===0 && !(nextDepth && nextDepth>headObj.depth)){
      push('h',headObj.num+' '+headObj.title,headObj.page,headObj.pl);
      stats.emptyHeads.push(headObj.num+' '+headObj.title);
    }
  }
  function headingOk(h){
    var p0=parseInt(h.num.split('.')[0],10);
    if(h.depth===1) return (p0>lastCh && p0<=lastCh+3) || (lastCh===0 && p0<=30);
    if(!hp.ch) return true;
    return p0===parseInt(hp.ch.num,10);
  }
  for(var q=0;q<flat.length;q++){
    var L=flat[q];
    if(L.tb){ if(!tbl){ flush(); tbl={rows:[],page:L.page,pl:L.pl}; } tbl.rows.push(L.t.split(SEP).join(' | ')); continue; }
    if(tbl){ push('tb',tbl.rows.join('\n'),tbl.page,tbl.pl); tbl=null; }
    var text=L.t, hd=parseHeading(text);
    if(hd && headingOk(hd)){
      flush(); closeHead(hd.depth); lead=''; leadN=0;
      var nx=flat[q+1];
      if(hd.title.length>=20 && !/[：:]$/.test(hd.title) && nx && !nx.tb && nx.page===L.page && nx.t.length<=15 && !BULLET_RE.test(nx.t) && !NUM_ITEM_RE.test(nx.t) && !parseHeading(nx.t)){ hd.title+=nx.t; q++; }
      hd.title=hd.title.replace(/[：:。\s]+$/,'');
      var ho={num:hd.num,depth:hd.depth,title:hd.title,page:L.page,pl:L.pl,count:0};
      if(hd.depth===1){ hp={ch:ho,sec:null,sub:null}; lastCh=parseInt(hd.num,10); }
      else if(hd.depth===2){ hp.sec=ho; hp.sub=null; }
      else hp.sub=ho;
      headObj=ho; stats.headings.push(ho);
      continue;
    }
    var isBul=BULLET_RE.test(text), isNum=!isBul && (NUM_ITEM_RE.test(text) || DLG_RE.test(text));
    var big=L.h>1.4*medH;
    if(isBul) text=text.replace(BULLET_RE,'');
    if(isBul||isNum){ flush(); cur={t:'',page:L.page,pl:L.pl,b:true}; }
    else if(big) flush();
    if(!cur) cur={t:'',page:L.page,pl:L.pl,b:false};
    cur.t=joinText(cur.t,text);
    cur.cx=(L.x0+L.x1)/2;
    var shortLine=L.x1 < rightM-2*Math.max(L.h,medH);
    var nxt=flat[q+1];
    var wrapTok=nxt && !nxt.tb && nxt.page===L.page && /^[A-Za-z0-9]/.test(nxt.t) && !/[。！？；：”"]$/.test(text);
    if(big || (shortLine && !/[，、]$/.test(text) && !wrapTok)) flush();
  }
  flush(); if(tbl){ push('tb',tbl.rows.join('\n'),tbl.page,tbl.pl); tbl=null; } closeHead(0);
  /* 7) 流程图：连续 3 个以上居中的短句，合成一条 */
  var merged=[];
  for(var a=0;a<chunks.length;){
    var c0=chunks[a];
    if(c0.k==='p' && !c0.b && c0.t.length<=14){
      var b=a; while(b<chunks.length && chunks[b].k==='p' && !chunks[b].b && chunks[b].t.length<=14 && chunks[b].pg===c0.pg && chunks[b].sec===c0.sec && chunks[b].ch===c0.ch) b++;
      var run=chunks.slice(a,b), cxs=run.map(function(r){return r.cx||0});
      if(run.length>=3 && Math.max.apply(null,cxs)-Math.min.apply(null,cxs)<40){
        var m=Object.assign({},run[0]); m.t=run.map(function(r){return r.t}).join(' → '); m.k='fl'; delete m.cx; merged.push(m); a=b; continue;
      }
    }
    merged.push(c0); a++;
  }
  /* 8) 太长的段落按句号切开 */
  var out=[];
  merged.forEach(function(c){
    delete c.cx;
    if(c.k==='p' && c.t.length>opt.maxLen){
      var sents=c.t.match(/[^。；！？]+[。；！？]*|[。；！？]+/g)||[c.t], buf='';
      sents.forEach(function(s){ if(buf && (buf+s).length>opt.pieceLen){ out.push(Object.assign({},c,{t:buf})); buf=''; } buf+=s; });
      if(buf) out.push(Object.assign({},c,{t:buf}));
    } else out.push(c);
  });
  out.forEach(function(c,i){ c.n=i; });
  stats.chunks=out.length;
  return {chunks:out, stats:stats};
}

/* ===== 搜索 ===== */
var FILLER = /[的了是吗呢吧啊么怎什如何多少可以请问我你他它们这那哪及或也都就还]/;
function tokenize(s){
  s=s.toLowerCase(); var out=[], m;
  var words=s.match(/[a-z0-9]+/g)||[];
  words.forEach(function(w){ if(w.length>=2 || /\d/.test(w)) out.push(w); });
  var runs=s.match(/[\u3400-\u9fff]+/g)||[];
  runs.forEach(function(r){ if(r.length===1){ if(!FILLER.test(r)) out.push(r); } else for(var i=0;i<r.length-1;i++){ var g=r.slice(i,i+2); if(!FILLER.test(g)) out.push(g); } });
  return out;
}
function prepChunk(c, name){
  c.m=name;
  var h=[c.chT,c.secT,c.subT,c.ld,c.t].map(function(x){return x||''}).join(' ').toLowerCase();
  c._k=new Set(tokenize(h));
  c._n=h.replace(/\s+/g,'');
}
function searchDB(db, q){
  var qn=q.toLowerCase().replace(/\s+/g,''); if(!qn) return {hits:[],qt:[]};
  var qt=Array.from(new Set(tokenize(q))); if(!qt.length) return {hits:[],qt:[]};
  var N=db.length, df=qt.map(function(){return 0;});
  for(var i=0;i<N;i++){ var k=db[i]._k; for(var j=0;j<qt.length;j++) if(k.has(qt[j])) df[j]++; }
  var w=df.map(function(d){ return Math.log(1+N/(1+d)); }), tot=0;
  w.forEach(function(x){ tot+=x; });
  var res=[];
  for(var a=0;a<N;a++){
    var c=db[a], hit=0, nh=0;
    for(var b=0;b<qt.length;b++) if(c._k.has(qt[b])){ hit+=w[b]; nh++; }
    var exact=c._n.indexOf(qn)>=0;
    if(!exact){ if(qt.length<=2 ? nh<qt.length : hit/tot<0.3) continue; }
    res.push({c:c, s:(hit/tot)+(exact?1:0)});
  }
  res.sort(function(x,y){ return (y.s-x.s)||(x.c.t.length-y.c.t.length); });
  return {hits:res, qt:qt};
}

</script>
<script>
/* ===== 界面 ===== */
var $ = function(id){ return document.getElementById(id); };
var FILE=null, LAST=null, DB=[], GM=new Map(), GC=new Map(), LEVEL='fine';
var PDFLIB=null;

function toast(msg){ var t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){ t.hidden=true; },2600); }
function tick(){ return new Promise(function(r){ setTimeout(r,0); }); }
function kb(n){ return n>1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(n/1024))+' KB'; }

/* 标签页 */
function showTab(name){
  $('pSplit').hidden = name!=='split'; $('pSearch').hidden = name!=='search';
  $('tabSplit').classList.toggle('on', name==='split'); $('tabSearch').classList.toggle('on', name==='search');
  if(name==='search') $('q').focus();
}
$('tabSplit').onclick=function(){ showTab('split'); };
$('tabSearch').onclick=function(){ showTab('search'); };
$('toSearch').onclick=function(){ showTab('search'); };

/* PDF 引擎：先找同目录下的本地文件，找不到再试网络 */
async function loadPdfjs(){
  if(PDFLIB) return PDFLIB;
  var CDN='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/';
  var tries=[
    {name:'本地', mod:'./pdf.min.mjs', worker:new URL('./pdf.worker.min.mjs', location.href).href, blob:false},
    {name:'网络', mod:CDN+'pdf.min.mjs', worker:CDN+'pdf.worker.min.mjs', blob:true}
  ];
  var errs=[];
  for(var i=0;i<tries.length;i++){
    var t=tries[i];
    try{
      var m=await import(t.mod);
      var ws=t.worker;
      if(t.blob){ var r=await fetch(t.worker); if(!r.ok) throw new Error('worker '+r.status); ws=URL.createObjectURL(new Blob([await r.text()],{type:'text/javascript'})); }
      m.GlobalWorkerOptions.workerSrc=ws;
      PDFLIB=m; $('engineMsg').textContent='PDF 引擎：'+t.name;
      return m;
    }catch(e){ errs.push(t.name+'：'+(e&&e.message||e)); }
  }
  throw new Error('没能加载 PDF 引擎。请把 pdf.min.mjs 和 pdf.worker.min.mjs 两个文件放在和本页相同的位置。（'+errs.join('；')+'）');
}

/* 选文件 */
$('pdfFile').onchange=function(){
  var f=this.files&&this.files[0]; if(!f) return;
  FILE=f; $('fileInfo').textContent=f.name+'　'+kb(f.size);
  $('mName').value=f.name.replace(/\.pdf$/i,'');
  $('goBtn').disabled=false; $('result').hidden=true; $('barFill').style.width='0'; $('progTxt').innerHTML='&nbsp;';
};

/* 拆分 */
$('goBtn').onclick=async function(){
  if(!FILE) return;
  var btn=this; btn.disabled=true; $('result').hidden=true;
  try{
    $('progTxt').textContent='正在加载 PDF 引擎…'; $('barFill').style.width='3%'; await tick();
    var lib=await loadPdfjs();
    var buf=await FILE.arrayBuffer();
    var doc=await lib.getDocument({data:new Uint8Array(buf), isEvalSupported:false}).promise;
    var pages=[];
    for(var i=1;i<=doc.numPages;i++){
      var pg=await doc.getPage(i), vp=pg.getViewport({scale:1}), tc=await pg.getTextContent(), items=[];
      for(var k=0;k<tc.items.length;k++){
        var it=tc.items[k]; if(typeof it.str!=='string') continue;
        items.push({s:it.str, x:it.transform[4], y:it.transform[5], w:it.width, h:it.height||Math.abs(it.transform[3])||0});
      }
      pages.push({w:vp.width, h:vp.height, items:items});
      if(pg.cleanup) pg.cleanup();
      $('barFill').style.width=(3+Math.round(i/doc.numPages*85))+'%';
      $('progTxt').textContent='读取第 '+i+' / '+doc.numPages+' 页';
      await tick();
    }
    if(doc.destroy) doc.destroy();
    $('progTxt').textContent='正在切分…'; await tick();
    var top=parseFloat($('cutTop').value), bot=parseFloat($('cutBot').value);
    var extra=$('extraJunk').value.split(/[,，、;；\n]/).map(function(x){return x.trim();}).filter(Boolean);
    var r=buildChunks(pages,{top:isNaN(top)?8:top, bottom:isNaN(bot)?8:bot, extra:extra});
    var name=($('mName').value||FILE.name.replace(/\.pdf$/i,'')).trim();
    r.chunks.forEach(function(c){ ['ch','chT','sec','secT','sub','subT','pl','ld'].forEach(function(p){ if(c[p]==='') delete c[p]; }); });
    var json='{"format":1,"name":'+JSON.stringify(name)+',"source":'+JSON.stringify(FILE.name)+',"built":"'+new Date().toISOString().slice(0,10)+'","pages":'+r.stats.pages+',"chunks":[\n'+r.chunks.map(function(c){return JSON.stringify(c);}).join(',\n')+'\n]}';
    LAST={name:name, json:json, fname:name.replace(/[\\\/:*?"<>|]/g,'_')+'.json'};
    addToDB(name, JSON.parse(json).chunks);
    showResult(r, json);
    $('barFill').style.width='100%'; $('progTxt').textContent='完成';
  }catch(e){
    $('progTxt').textContent='出错：'+(e&&e.message||e);
    $('barFill').style.width='0';
  }
  btn.disabled=false;
};

function showResult(r, json){
  var st=r.stats;
  $('sum').textContent='共 '+st.pages+' 页 → '+st.chunks+' 条，JSON 约 '+kb(json.length*1.6);
  var w=[];
  function add(cls,html){ w.push('<div class="note '+cls+'">'+html+'</div>'); }
  function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  if(st.tocPages.length) add('','已跳过目录页：第 '+st.tocPages.join('、')+' 页');
  if(st.blankPages.length) add('','已跳过空白页：第 '+st.blankPages.join('、')+' 页');
  if(st.autoJunk.length) add('','自动识别并去掉的水印文字：'+esc(st.autoJunk.join('、')));
  if(!st.headings.length) add('warn','<b>没认出章节编号。</b>会按段落切分，但搜索结果里没有章节名。');
  if(st.emptyHeads.length) add('warn','<b>只有标题、没有文字的小节：</b>'+esc(st.emptyHeads.join('；'))+'。内容很可能是图片，图片里的字读不到。');
  if(st.lowTextPages.length) add('warn','<b>文字很少的页：</b>第 '+st.lowTextPages.join('、')+' 页，可能是图片或扫描页。');
  $('warns').innerHTML=w.join('');
  var li=st.headings.map(function(h){
    var cls='d'+Math.min(h.depth,3)+(h.count===0&&h.depth>1?' empty':'');
    var cnt=(h.count===0&&h.depth>1)?'无文字':(h.count>0?h.count+' 段':'');
    return '<li class="'+cls+'"><span class="sign">'+esc(h.num)+'</span><span>'+esc(h.title)+'</span><span class="cnt">'+cnt+(h.pl?' · '+esc(h.pl):'')+'</span></li>';
  });
  $('toc').innerHTML=li.join('');
  $('tocSum').textContent='章节目录（'+st.headings.length+' 个）';
  $('result').hidden=false;
  $('result').scrollIntoView({behavior:'smooth', block:'start'});
}

/* 导出 */
$('dlBtn').onclick=function(){
  if(!LAST) return;
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([LAST.json],{type:'application/json'}));
  a.download=LAST.fname; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },3000);
  toast('已生成 '+LAST.fname);
};
$('cpBtn').onclick=async function(){
  if(!LAST) return;
  try{ await navigator.clipboard.writeText(LAST.json); toast('已复制，可粘贴到 GitHub 新建文件里'); }
  catch(e){
    var ta=document.createElement('textarea'); ta.value=LAST.json; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('已复制'); }catch(e2){ toast('复制失败，请用“下载 JSON”'); }
    ta.remove();
  }
};

/* ===== 试搜数据 ===== */
function addToDB(name, chunks){
  DB=DB.filter(function(c){ return c.m!==name; });
  chunks.forEach(function(c){ prepChunk(c,name); DB.push(c); });
  rebuildGroups(); refreshDb();
}
function rebuildGroups(){
  GM=new Map(); GC=new Map();
  DB.forEach(function(c){
    var km=c.m+'|'+(c.ch||'')+'|'+(c.sec||'_'), kc=c.m+'|'+(c.ch||'');
    if(!GM.has(km)) GM.set(km,[]); GM.get(km).push(c);
    if(!GC.has(kc)) GC.set(kc,[]); GC.get(kc).push(c);
  });
}
function refreshDb(){
  var by={}; DB.forEach(function(c){ by[c.m]=(by[c.m]||0)+1; });
  var names=Object.keys(by);
  $('dbBadge').textContent=names.length?'('+DB.length+')':'';
  $('dbInfo').innerHTML=names.length ? names.map(function(n){ return n.replace(/[&<>]/g,'')+'：'+by[n]+' 条'; }).join('<br>') : '还没有';
  doSearch();
}
$('jsonFile').onchange=async function(){
  var fs=Array.prototype.slice.call(this.files||[]); var ok=0;
  for(var i=0;i<fs.length;i++){
    try{ var j=JSON.parse(await fs[i].text()); if(j&&j.chunks){ addToDB(j.name||fs[i].name.replace(/\.json$/i,''), j.chunks); ok++; } }
    catch(e){ toast('读不了：'+fs[i].name); }
  }
  if(ok) toast('已载入 '+ok+' 个文件');
  this.value='';
};
$('clearDb').onclick=function(){ DB=[]; rebuildGroups(); refreshDb(); };

/* ===== 搜索显示 ===== */
function hl(text, qt){
  var low=text.toLowerCase(), rg=[];
  qt.forEach(function(t){ var i=0; while((i=low.indexOf(t,i))>=0){ rg.push([i,i+t.length]); i+=t.length; } });
  var frag=document.createDocumentFragment();
  if(!rg.length){ frag.appendChild(document.createTextNode(text)); return frag; }
  rg.sort(function(a,b){return a[0]-b[0]||b[1]-a[1];});
  var m=[rg[0]];
  for(var i=1;i<rg.length;i++){ var l=m[m.length-1]; if(rg[i][0]<=l[1]) l[1]=Math.max(l[1],rg[i][1]); else m.push(rg[i]); }
  var p=0;
  m.forEach(function(r){
    if(r[0]>p) frag.appendChild(document.createTextNode(text.slice(p,r[0])));
    var mk=document.createElement('mark'); mk.textContent=text.slice(r[0],r[1]); frag.appendChild(mk); p=r[1];
  });
  if(p<text.length) frag.appendChild(document.createTextNode(text.slice(p)));
  return frag;
}
function keyOf(c){
  if(LEVEL==='fine') return c.m+'#'+c.n;
  if(LEVEL==='mid') return c.m+'|'+(c.ch||'')+'|'+(c.sec||'_');
  return c.m+'|'+(c.ch||'');
}
function pageText(c){ return c.pl ? '页码 '+c.pl : '第 '+c.pg+' 页'; }
function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }

function doSearch(){
  var q=$('q').value.trim(), box=$('results');
  box.textContent='';
  if(!DB.length){ box.appendChild(el('div','empty-s','先在“拆分”里拆一本手册，或在下面载入之前导出的 JSON。')); $('stat').textContent=''; return; }
  if(!q){ box.appendChild(el('div','empty-s','输入问题，或点“说话”。')); $('stat').textContent=''; return; }
  var t0=performance.now(), r=searchDB(DB,q), hits=r.hits;
  var groups=new Map(), order=[];
  hits.forEach(function(h){
    var k=keyOf(h.c), g=groups.get(k);
    if(!g){ g={first:h.c, score:h.s, hit:new Set()}; groups.set(k,g); order.push(k); }
    g.hit.add(h.c);
  });
  var ms=(performance.now()-t0).toFixed(0);
  $('stat').textContent=hits.length? '找到 '+hits.length+' 处，分成 '+order.length+' 组　用时 '+ms+' 毫秒' : '';
  if(!hits.length){ box.appendChild(el('div','empty-s','没找到。换个说法，或少说几个字试试。')); return; }
  var cap=LEVEL==='fine'?15:6;
  order.slice(0,cap).forEach(function(k){
    var g=groups.get(k), c=g.first, wrap=el('div','grp');
    var gh=el('div','gh'), num=LEVEL==='coarse'?(c.ch||''):(c.sec||c.ch||'');
    var title=LEVEL==='coarse'?(c.chT||''):(c.secT||c.chT||'');
    if(num) gh.appendChild(el('span','sign',num));
    gh.appendChild(el('span','gt',title||'（无标题）'));
    var sub=[c.m]; if(LEVEL!=='coarse' && c.sec && c.chT) sub.push(c.chT);
    if(LEVEL==='fine') sub.push(pageText(c));
    gh.appendChild(el('span','gs',sub.join(' · ')));
    wrap.appendChild(gh);
    var list = LEVEL==='fine' ? [c] : (LEVEL==='mid' ? GM.get(c.m+'|'+(c.ch||'')+'|'+(c.sec||'_')) : GC.get(c.m+'|'+(c.ch||'')));
    var shown=list.slice(0,60);
    shown.forEach(function(x){
      var isHit=g.hit.has(x), p=el('div','seg-p'+(x.k==='h'?' h':'')+(isHit?' hit':(LEVEL==='fine'?'':' dim')));
      if(x.ld){ p.appendChild(el('span','ld',x.ld)); }
      if(x.k==='h') p.appendChild(document.createTextNode('（本节只有标题，内容可能是图片）'));
      else p.appendChild(hl(x.t, r.qt));
      wrap.appendChild(p);
    });
    if(list.length>shown.length) wrap.appendChild(el('div','meta','…还有 '+(list.length-shown.length)+' 段'));
    box.appendChild(wrap);
  });
  if(order.length>cap) box.appendChild(el('div','meta','只显示前 '+cap+' 组，说得更具体些会更准。'));
}
var dbt=null;
$('q').addEventListener('input', function(){ clearTimeout(dbt); dbt=setTimeout(doSearch,120); });
$('lvl').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  LEVEL=b.getAttribute('data-l');
  Array.prototype.forEach.call($('lvl').children, function(x){ x.classList.toggle('on', x===b); });
  doSearch();
});

/* ===== 语音 ===== */
var REC=null, tStart=0, tFirst=0;
$('mic').onclick=function(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var msg=$('micMsg'), btn=$('mic');
  if(!SR){ msg.textContent='这个浏览器不支持语音识别。可以用键盘上的听写键代替。'; return; }
  if(REC){ try{ REC.stop(); }catch(e){} return; }
  var rec=new SR(); REC=rec;
  rec.lang='zh-CN'; rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;
  rec.onstart=function(){ btn.classList.add('rec'); btn.textContent='停止'; msg.textContent='请说话…'; tStart=performance.now(); tFirst=0; };
  rec.onresult=function(e){
    if(!tFirst) tFirst=performance.now()-tStart;
    var t=''; for(var i=0;i<e.results.length;i++) t+=e.results[i][0].transcript;
    $('q').value=t; doSearch();
  };
  rec.onerror=function(e){
    var m={'not-allowed':'麦克风被禁止。到 设置 > Safari > 麦克风 里允许，或是公司限制了。',
           'service-not-allowed':'系统听写没开。到 设置 > 通用 > 键盘 里打开“听写”。',
           'no-speech':'没听到声音，再点一次说话。','audio-capture':'找不到麦克风。','network':'语音识别需要联网。'}[e.error];
    msg.textContent=m||('识别出错：'+e.error);
  };
  rec.onend=function(){
    btn.classList.remove('rec'); btn.textContent='说话'; REC=null;
    if(tFirst && /^请说话/.test(msg.textContent)) msg.textContent='识别结束，第一个字出现用了 '+Math.round(tFirst)+' 毫秒';
  };
  try{ rec.start(); }catch(e){ msg.textContent='无法启动：'+(e&&e.message||e); REC=null; }
};
</script>
